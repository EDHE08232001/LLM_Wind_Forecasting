# Tiny, fast configuration on SYNTHETIC data (generated by scripts/00_download_data.py --synthetic
# or automatically by scripts/demo.py --synthetic). Exercises every stage in a few minutes on CPU.
# Results go to results/smoke/ (git-ignored). Never report these numbers.
base: default.yaml
name: smoke

paths:
  raw_dir: data/synthetic/raw
  scada_csv: data/synthetic/raw/T1.csv
  weather_csv: data/synthetic/raw/weather_merra2_2018.csv
  processed: data/synthetic/processed/hourly_clean.parquet
  results_dir: results/smoke
  checkpoints_dir: checkpoints/smoke

baselines:
  xgboost:
    n_estimators: 200
    grid: {max_depth: [3], learning_rate: [0.1], subsample: [0.8], colsample_bytree: [0.8]}
    default: {max_depth: 4, learning_rate: 0.1, n_estimators: 100, subsample: 0.8, colsample_bytree: 0.8}

train:
  epochs: 3
  batch_size: 256
  patience: 2
  seeds_protocol_b: [0]

chronos:
  context_length: 128
  variants: [univariate, past_covariates]

finetune:
  context_lengths: [128]
  learning_rates: [1.0e-4]
  num_steps: 6
  eval_every: 3
  batch_size: 64
  val_max_origins: 24

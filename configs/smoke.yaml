# Fast end-to-end check on SYNTHETIC data (generated automatically, nothing real is downloaded
# except the Chronos-2 weights). A few minutes on a laptop. Outputs go to results/smoke/, which
# is git-ignored. Never report these numbers.
base: default.yaml
name: smoke

paths:
  scada_csv: data/synthetic/raw/T1.csv
  weather_csv: data/synthetic/raw/weather_merra2_2018.csv
  processed: data/synthetic/processed/hourly_clean.parquet
  results_dir: results/smoke
  checkpoints_dir: checkpoints/smoke

chronos:
  context_length: 128

finetune:
  context_lengths: [128]
  learning_rates: [1.0e-4]
  num_steps: 20
  eval_every: 10
  batch_size: 64
  val_max_origins: 48

report:
  bootstrap_samples: 200

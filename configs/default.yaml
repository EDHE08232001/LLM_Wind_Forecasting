# Default configuration: the full experiment on the real data.
# Every script takes `--config <this file>`; any key can be overridden on the command line with
# `--set key.sub=value` (for example --set finetune.num_steps=300).

name: default
seed: 42
device: auto            # auto | cuda | mps | cpu   (auto = cuda > mps > cpu)

paths:
  scada_csv: data/raw/T1.csv                      # Kaggle "wind-turbine-scada-dataset"
  weather_csv: data/raw/weather_merra2_2018.csv   # NASA POWER (MERRA-2) or a renewables.ninja export
  processed: data/processed/hourly_clean.parquet
  results_dir: results
  checkpoints_dir: checkpoints

site:
  name: Esenkoy (Nordex N117/3600)
  latitude: 40.58545
  longitude: 28.99035
  # Hours to subtract from SCADA timestamps to get UTC (the weather is in UTC). The Kaggle file does
  # not document its timezone; Turkey is UTC+3. 0 keeps timestamps as they are, like the paper.
  scada_utc_offset_hours: 0

data:
  year: 2018
  freq_raw: 10min
  resample: first        # first = keep the on-the-hour sample (paper); mean = hourly average
  impute:
    k: 5                 # kNN imputation with k = 5, as in the paper
    fit_on: train        # train = neighbours come from the training months only (no leakage) | all
  clean:                 # the paper's cleaning rules; rows are flagged, not dropped
    cut_in_ms: 3.5
    cut_out_ms: 25.5
    iqr_factor: 1.5

split:                   # chronological: train Jan-Aug, validation Sep-Oct, test Nov-Dec
  train_end: "2018-08-31 23:00"
  val_end: "2018-10-31 23:00"

evaluation:
  horizons: [1, 24]      # hours ahead
  subsets: [all, clean]  # clean = only the target hours the paper's cleaning rules keep
  wind_bins: [0, 5, 10, 13, 26]   # m/s, for the error-by-wind-speed analysis

chronos:
  model_id: amazon/chronos-2
  context_length: 512    # hours of history for zero-shot
  batch_size: 256        # Chronos-2 counts series per batch (the target plus each covariate)
  covariates: [wind_speed, wd_sin, wd_cos, theoretical_power, temperature, precipitation,
               air_density, ground_irradiance, toa_irradiance, cloud_cover]
  # univariate      = power history only
  # past_covariates = + history of the covariates (a true forecast)
  # paper_inputs    = + the covariates at the target hours, i.e. the same-hour inputs the paper's
  #                   networks used. This is the variant to compare with the paper's Table 5.
  variants: [univariate, past_covariates, paper_inputs]

finetune:
  method: lora           # lora | qlora (4-bit base weights; NVIDIA GPU + bitsandbytes only)
  variants: [paper_inputs, past_covariates]   # one adapter is trained per variant
  context_lengths: [168, 512]   # grid, scored on the validation months
  learning_rates: [1.0e-5, 1.0e-4]
  num_steps: 1000
  batch_size: 256        # series per batch (each training window = the target + its covariates)
  prediction_length: 24
  eval_every: 100        # validation RMSE is measured every this many steps
  select_best: true      # keep the step with the lowest validation RMSE (step 0 = zero-shot counts)
  val_max_origins: 400   # validation targets used for that measurement
  max_grad_norm: 1.0
  weight_decay: 0.0
  warmup_ratio: 0.05
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    # Adapters go on the attention projections (time attention and group attention) and on the
    # output head, the same modules as the Chronos-2 library's own LoRA recipe.
    target_modules: [self_attention.q, self_attention.k, self_attention.v, self_attention.o,
                     output_patch_embedding.output_layer]

report:
  headline: {variant: paper_inputs, horizon: 1, subset: clean}   # the row put next to the paper's
  sample_week_start: "2018-11-12 00:00"
  bootstrap_samples: 2000
